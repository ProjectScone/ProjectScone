[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scone-client"
version = "0.2.1"
description = "Python client for the Scone HTTP API, a local-first temporal memory engine"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ProjectScone contributors" }]
keywords = ["scone", "memory", "recall", "client"]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ProjectScone/ProjectScone"
Source = "https://github.com/ProjectScone/ProjectScone"

[tool.setuptools]
packages = ["scone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a real `scone serve` process (needs the built binary)",
]
