<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scone</title>
<style>
  :root {
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef1f5; --line: #e2e6ec; --line-strong: #cfd5de;
    --ink: #0f172a; --muted: #5f6b7d; --accent: #2563eb; --accent-soft: #e8efff; --on-accent: #ffffff;
    --ok: #15803d; --warn: #b91c1c; --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px -16px rgba(15, 23, 42, .18);
    --nav-w: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-scheme="light"]) {
      --bg: #0b0f14; --surface: #11161d; --surface-2: #171e28; --line: #222b37; --line-strong: #2f3a49;
      --ink: #e6e9ee; --muted: #8b96a8; --accent: #5b9cf6; --accent-soft: #132139; --on-accent: #0b0f14;
      --ok: #4ade80; --warn: #f87171; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-scheme="dark"] {
    --bg: #0b0f14; --surface: #11161d; --surface-2: #171e28; --line: #222b37; --line-strong: #2f3a49;
    --ink: #e6e9ee; --muted: #8b96a8; --accent: #5b9cf6; --accent-soft: #132139; --on-accent: #0b0f14;
    --ok: #4ade80; --warn: #f87171; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 "Inter", ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* shell */
  .shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100%; }
  .shell > * { min-width: 0; }
  nav.side {
    border-right: 1px solid var(--line); padding: 24px 14px 20px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 26px; background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
  .brand .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); position: relative; flex: none; }
  .brand .mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--on-accent); opacity: .95; }
  .brand .name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.1; }
  .brand .space { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .group h2 { margin: 0 0 6px; padding: 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
              text-transform: uppercase; color: var(--muted); }
  .group button.nav, .group a.nav {
    display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left;
    padding: 7px 8px; border-radius: 6px; border: 0; background: none; color: var(--ink); cursor: pointer; text-decoration: none;
  }
  .group a.nav[hidden] { display: none; }
  .group button.nav:hover, .group a.nav:hover { background: var(--surface-2); text-decoration: none; }
  .group button.nav[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count { font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line);
           border-radius: 10px; padding: 0 7px; line-height: 18px; }
  .group button.nav[aria-current="true"] .count { color: var(--accent); }
  nav.side .foot { margin-top: auto; color: var(--muted); font-size: 12px; padding: 0 8px; }

  main { padding: 40px 48px 96px; max-width: 980px; width: 100%; min-width: 0; overflow-wrap: anywhere; }
  .page-head { margin-bottom: 32px; }
  .page-head .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .page-head h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .page-head p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 14.5px; }

  /* topbar for narrow screens */
  .topbar { display: none; }
  .scrim { display: none; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    nav.side { position: fixed; inset: 0 auto 0 0; width: min(80vw, 300px); transform: translateX(-100%);
               transition: transform .18s ease; z-index: 20; border-right: 1px solid var(--line); }
    nav.side.open { transform: none; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 15; display: none; }
    .scrim.open { display: block; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line);
              position: sticky; top: 0; background: var(--bg); z-index: 10; }
    .topbar .name { font-weight: 600; }
    .topbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    main { padding: 24px 16px 64px; }
    .page-head h1 { font-size: 21px; }
    .ev { grid-template-columns: 48px 1fr !important; }
    .ev .k { display: none; }
    .proposal { grid-template-columns: 1fr !important; }
  }

  /* search */
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; height: 46px; padding: 0 16px; font: inherit; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); min-width: 0; box-shadow: var(--shadow);
  }
  .search input:focus { border-color: var(--accent); }
  .search input::placeholder { color: var(--muted); }
  .btn { height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent);
         color: var(--on-accent); cursor: pointer; font-weight: 600; }
  .btn:hover { filter: brightness(1.06); }
  .btn.small { height: 32px; padding: 0 12px; font-weight: 500; border-radius: 8px; }
  .btn.quiet { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn.quiet:hover { background: var(--surface-2); filter: none; }
  .btn.danger { background: var(--surface); color: var(--warn); border-color: var(--line-strong); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px;
          background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; font-weight: 500; }
  .chip b { font-weight: 500; color: var(--muted); }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; line-height: 1; }
  .chip button:hover { color: var(--warn); }
  .chip.add { background: var(--surface); border: 1px solid var(--line-strong); color: var(--muted); cursor: pointer; font-weight: 400; }
  .chip.add:hover { border-color: var(--accent); color: var(--accent); }
  .addrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .addrow[hidden] { display: none; }
  .addrow input, .addrow select { height: 34px; padding: 0 10px; font: inherit; border-radius: 6px; border: 1px solid var(--line);
                                  background: var(--surface); color: var(--ink); }
  .summary-line { color: var(--muted); font-size: 13px; margin: 20px 0 8px; }

  /* rows */
  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .row { padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
  .row .meta { color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .row .text { font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row .text .label { color: var(--muted); font-size: 12px; margin-right: 6px; }
  details.why { margin-top: 8px; }
  details.why summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::before { content: "▸"; font-size: 11px; }
  details.why[open] summary::before { content: "▾"; }
  .why-body { margin-top: 10px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
              display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; align-items: center; }
  .why-body .k { color: var(--muted); }
  .rank { height: 4px; border-radius: 2px; background: var(--accent-soft); width: 160px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .rank i { display: block; height: 100%; background: var(--accent); }
  .fb { display: flex; gap: 8px; align-items: center; }
  .fb button { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 12.5px; }
  .fb button.set { border-color: var(--accent); color: var(--accent); }

  /* facts */
  .facts-inline { padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .facts-inline h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .fact { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; padding: 3px 0; }
  .fact .s { font-weight: 600; } .fact .p { color: var(--muted); } .fact .since { color: var(--muted); font-size: 12px; }
  .origin { font-size: 12px; color: var(--muted); }
  .origin.extracted, .origin.inferred { color: var(--accent); }

  /* beliefs */
  .subject { margin: 28px 0 10px; font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .subject:first-child { margin-top: 0; }
  .belief { padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .belief .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .belief .pred { color: var(--muted); font-size: 13px; }
  .belief .now { font-weight: 600; }
  .belief .head .spacer { flex: 1; }
  .timeline { display: flex; height: 24px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .seg { display: flex; align-items: center; padding: 0 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
         border-right: 1px solid var(--line); background: var(--surface-2); color: var(--muted); min-width: 0; }
  .seg.active { background: var(--accent); color: var(--on-accent); }
  .seg.excluded { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
  .seg:last-child { border-right: 0; }
  .legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  details.actions { position: relative; }
  details.actions summary { list-style: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; }
  details.actions summary::-webkit-details-marker { display: none; }
  details.actions summary:hover { border-color: var(--line); }
  details.actions .menu { position: absolute; right: 0; top: 100%; z-index: 5; margin-top: 4px; min-width: 240px; background: var(--surface);
                          border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
  details.actions .menu button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  details.actions .menu button:hover { background: var(--surface-2); }
  details.actions .menu button.danger { color: var(--warn); }

  /* review */
  .proposal { padding: 18px 20px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; }
  .proposal:last-child { border-bottom: 0; }
  .proposal .triple { font-size: 15px; }
  .proposal .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .proposal .excerpt { grid-column: 1 / -1; margin-top: 6px; padding: 10px 14px; background: var(--surface-2); border-radius: 8px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .proposal .excerpt .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 4px; }
  .proposal .decide { display: flex; gap: 8px; align-items: flex-start; }

  /* live */
  .statusline { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; }
  .dot.off { background: var(--warn); }
  .statusline select { height: 30px; padding: 0 8px; font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .minute { margin: 18px 0 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev { display: grid; grid-template-columns: 52px 96px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: baseline; }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .ev .k { color: var(--muted); font-size: 12.5px; }
  .ev .d { overflow-wrap: anywhere; }
  .state { font-size: 12px; margin-left: 8px; }
  .state.ok { color: var(--ok); } .state.bad { color: var(--warn); } .state.run { color: var(--accent); }
  .jobs h3 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .job { padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; box-shadow: var(--shadow); }
  .job .name { font-weight: 600; } .job .sub { color: var(--muted); font-size: 12.5px; grid-column: 1; }
  .job .prog { font-variant-numeric: tabular-nums; text-align: right; }

  /* analytics */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .panel h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .panel .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .fig { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .fig:last-child { border-bottom: 0; }
  .fig .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fig .v { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .fig .n { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  .none { color: var(--muted); font-style: italic; }
  .foot { margin-top: 20px; color: var(--muted); font-size: 12.5px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 24px; }
  .foot b { color: var(--ink); font-weight: 500; }
  .spark { display: flex; gap: 2px; align-items: flex-end; height: 36px; margin-top: 8px; }
  .spark i { display: block; flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }

  /* scopes, status */
  .kv { display: grid; grid-template-columns: max-content 1fr auto; gap: 8px 16px; align-items: center; }
  .bar { height: 5px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; min-width: 120px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .stat { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat span:last-child { color: var(--muted); text-align: right; }
  .flow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .flow .node { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
  .flow .node small { display: block; color: var(--muted); font-size: 11.5px; }
  .flow .arrow { color: var(--muted); }

  .empty { color: var(--muted); padding: 40px 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 12px; }
  .empty code { font-size: 13px; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; color: var(--ink); }
  .err { color: var(--warn); }
  .keyform { max-width: 440px; margin: 48px auto; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .keyform input { width: 100%; height: 40px; padding: 0 12px; margin: 12px 0; font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .linkish { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; font-size: inherit; }
  .linkish:hover { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<div class="topbar">
  <button id="menu" aria-label="Open navigation">Menu</button>
  <span class="name">Scone</span>
  <span id="topspace" style="color:var(--muted);font-size:12px"></span>
</div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side">
    <div class="brand"><div class="mark" aria-hidden="true"></div><div><div class="name">Scone</div><div class="space" id="space">memory</div></div></div>
    <div class="group"><h2>Memory</h2>
      <button class="nav" data-view="search">Search</button>
      <button class="nav" data-view="beliefs">Beliefs</button>
      <button class="nav" data-view="review">Review <span class="count" id="review-count" hidden>0</span></button>
    </div>
    <div class="group"><h2>Activity</h2>
      <button class="nav" data-view="live">Live</button>
      <button class="nav" data-view="analytics">Analytics</button>
      <a class="nav" id="playground-link" href="/playground" hidden>Playground <span class="count">preview</span></a>
    </div>
    <div class="group"><h2>System</h2>
      <button class="nav" data-view="scopes">Scopes</button>
      <button class="nav" data-view="status">Status</button>
    </div>
    <div class="foot" id="foot"></div>
  </nav>
  <main>
    <div class="page-head"><div class="eyebrow" id="eyebrow">Memory</div><h1 id="title">Search</h1><p id="intro"></p></div>
    <div id="out"></div>
  </main>
</div>
<script>
const BAKED = document.currentScript.dataset.token || "__SCONE_TOKEN__";
let TOKEN = BAKED.startsWith("__") ? (sessionStorage.getItem("scone-key") || "") : BAKED;
const out = document.getElementById("out");
let view = "search";
let gen = 0;  // bumped on every navigation; async work compares before writing
const state = { q: "", where: {}, tags: [], asOf: "" };
const stale = (g) => g !== gen;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const day = (s) => (s || "").slice(0, 10);
const clock = (s) => (s || "").slice(11, 19);

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { authorization: "Bearer " + TOKEN, "content-type": "application/json", ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { TOKEN = ""; sessionStorage.removeItem("scone-key"); gen += 1; askKey(); throw new Error("key needed"); }
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}
const show = (html) => { out.innerHTML = html; };
const safeHref = (url) => { try { const u = new URL(url, location.href); return u.protocol === "http:" || u.protocol === "https:" ? u.href : null; } catch (_) { return null; } };
const sourceHtml = (src) => { if (!src) return ""; const href = safeHref(src); return href ? `<a href="${esc(href)}" target="_blank" rel="noreferrer noopener">${esc(src)}</a>` : `<span title="source">${esc(src)}</span>`; };
const fail = (e) => { if (e.message !== "key needed") show(`<p class="err">${esc(e.message)}</p>`); };
const GROUP = { search: "Memory", beliefs: "Memory", review: "Memory", live: "Activity", analytics: "Activity", scopes: "System", status: "System" };
const setHead = (title, intro) => { document.getElementById("eyebrow").textContent = GROUP[view] || ""; document.getElementById("title").textContent = title; document.getElementById("intro").textContent = intro; };

function askKey() {
  setHead("Which space?", "");
  show(`<form class="keyform" id="keyform">
    <p>This server has more than one key. Enter the key for the space you want to open; it stays in this tab.</p>
    <input type="password" id="key" placeholder="bearer key" autocomplete="off">
    <button class="btn">Open</button></form>`);
  document.getElementById("keyform").onsubmit = (e) => {
    e.preventDefault();
    TOKEN = document.getElementById("key").value.trim();
    sessionStorage.setItem("scone-key", TOKEN);
    activate(view);
  };
}

/* ---------- search ---------- */
const chipHtml = () => {
  const chips = [];
  for (const [k, v] of Object.entries(state.where)) chips.push(`<span class="chip"><b>${esc(k)}</b> ${esc(v)} <button data-rm-where="${esc(k)}" aria-label="remove">×</button></span>`);
  for (const t of state.tags) chips.push(`<span class="chip"><b>tag</b> ${esc(t)} <button data-rm-tag="${esc(t)}" aria-label="remove">×</button></span>`);
  if (state.asOf) chips.push(`<span class="chip"><b>as of</b> ${esc(state.asOf)} <button data-rm-asof aria-label="remove">×</button></span>`);
  chips.push(`<button class="chip add" id="addchip">+ filter</button>`);
  return `<div class="chips" id="chips">${chips.join("")}</div>
    <div class="addrow" id="addrow" hidden>
      <select id="fkind"><option value="where">scope key = value</option><option value="tag">tag</option><option value="asof">as of date</option></select>
      <input id="fkey" placeholder="user_id" style="width:130px"><input id="fval" placeholder="alice" style="width:160px">
      <button class="btn small quiet" id="fadd">Add</button>
    </div>`;
};

function searchShell(resultsHtml) {
  setHead("Search", "Ask in plain words. Every result is an excerpt of something stored, and says where it came from.");
  show(`<div class="search"><input type="search" id="q" placeholder="Where does Bob live?" autocomplete="off" value="${esc(state.q)}"><button class="btn" id="run">Search</button></div>
    ${chipHtml()}<div id="results">${resultsHtml || ""}</div>`);
  const q = document.getElementById("q");
  document.getElementById("run").onclick = () => { state.q = q.value.trim(); runSearch(); };
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") { state.q = q.value.trim(); runSearch(); } });
  const kind = document.getElementById("fkind");
  kind.onchange = () => {
    const k = document.getElementById("fkey"), v = document.getElementById("fval");
    k.hidden = kind.value !== "where"; v.type = kind.value === "asof" ? "date" : "text";
    v.placeholder = kind.value === "tag" ? "work" : "alice";
  };
  document.getElementById("addchip").onclick = () => { const r = document.getElementById("addrow"); r.hidden = !r.hidden; kind.onchange(); };
  document.getElementById("fadd").onclick = () => {
    const k = document.getElementById("fkey").value.trim(), v = document.getElementById("fval").value.trim();
    if (kind.value === "where" && k && v) state.where[k] = v;
    if (kind.value === "tag" && v && !state.tags.includes(v)) state.tags.push(v);
    if (kind.value === "asof" && v) state.asOf = v;
    runSearch();
  };
}

async function runSearch() {

    const factsHtml = facts.length ? `<div class="facts-inline"><h3>Recorded claims that held${state.asOf ? " on " + esc(state.asOf) : ""}</h3>` +

    results.innerHTML = line + factsHtml + `<div class="rows">` + items.map((i) => `
      <div class="row">

          ${(i.tags || []).map((t) => `<button class="linkish" data-tag="${esc(t)}" title="Add tag filter ${esc(t)}">#${esc(t)}</button>`).join("")}</div>
        <div class="text"><span class="label">excerpt</span>${esc(i.text)}</div>
        <details class="why"><summary>why this</summary><div class="why-body">
          <span class="k">rank in this query</span><span><span class="rank"><i style="width:${Math.round((i.score || 0) * 100)}%"></i></span> <span style="color:var(--muted);font-size:12px">${(i.score || 0).toFixed(2)}, top is 1.00</span></span>
          <span class="k">found by</span><span>${i.lanes && i.lanes.vector ? `vector lane, rank ${i.lanes.vector}` : ""}${i.lanes && i.lanes.vector && i.lanes.text ? " and " : ""}${i.lanes && i.lanes.text ? `text lane, rank ${i.lanes.text}` : ""}${!i.lanes || (!i.lanes.vector && !i.lanes.text) ? "unknown" : ""}</span>
          ${i.similarity != null ? `<span class="k">cosine similarity</span><span>${i.similarity.toFixed(3)} <span style="color:var(--muted);font-size:12px">uncalibrated</span></span>` : ""}
          <span class="k">episode</span><span>#${i.episode_id}, chunk #${i.chunk_id}</span>
          ${r.event_id != null ? `<span class="k">useful?</span><span class="fb"><button data-fb="1" data-ev="${r.event_id}" data-chunk="${i.chunk_id}">yes</button><button data-fb="0" data-ev="${r.event_id}" data-chunk="${i.chunk_id}">no</button></span>` : ""}
        </div></details>
      </div>`).join("") + "</div>";

/* ---------- beliefs ---------- */
function chains(facts) {
  const bySubject = new Map();
  for (const f of facts) {
    if (!bySubject.has(f.subject)) bySubject.set(f.subject, new Map());
    const preds = bySubject.get(f.subject);
    if (!preds.has(f.predicate)) preds.set(f.predicate, []);
    preds.get(f.predicate).push(f);
  }
  for (const preds of bySubject.values()) for (const list of preds.values()) list.sort((a, b) => a.valid_from.localeCompare(b.valid_from) || a.fact_id - b.fact_id);
  return bySubject;
}

async function beliefs() {
  const g = gen;
  setHead("Beliefs", "What is believed about each subject, and how it changed over time.");
  try {
    const r = await api("/v1/facts?all=true&excluded=true");
    if (stale(g)) return;
    const list = (r.facts || []).filter((f) => f.status === "active" || f.status === "closed");
    if (!list.length) return show(`<p class="empty">No beliefs yet. Assert one with <code>scone-memory assert</code>, or approve a proposal under Review.</p>`);
    const now = Date.now();
    let html = "";
    for (const [subject, preds] of chains(list)) {
      html += `<div class="subject">${esc(subject)}</div>`;
      for (const [pred, facts] of preds) {
        const start = Math.min(...facts.map((f) => Date.parse(f.valid_from)));
        const span = Math.max(now - start, 86400000);
        const current = facts.find((f) => f.status === "active" && !f.excluded_reason);
        const segs = facts.map((f) => {
          const from = Date.parse(f.valid_from), to = f.valid_until ? Date.parse(f.valid_until) : now;
          const w = Math.max(((to - from) / span) * 100, 8);
          const cls = f.excluded_reason ? "excluded" : f.status === "active" ? "active" : "";
          return `<div class="seg ${cls}" style="flex:${w.toFixed(2)} 0 0" title="${esc(f.object)}, ${esc(day(f.valid_from))} to ${f.valid_until ? esc(day(f.valid_until)) : "now"}${f.closed_reason ? "\n" + esc(f.closed_reason) : ""}${f.excluded_reason ? "\nexcluded: " + esc(f.excluded_reason) : ""}">${esc(f.object)}</div>`;
        }).join("");
        const notes = facts.filter((f) => (f.closed_reason && !/^superseded by fact/.test(f.closed_reason)) || f.excluded_reason)
          .map((f) => `<div class="note">${esc(f.object)}: ${f.excluded_reason ? "excluded from recall, " + esc(f.excluded_reason) : "closed " + esc(day(f.valid_until)) + ", " + esc(f.closed_reason)}</div>`).join("");
        const origins = [...new Set(facts.map((f) => f.origin || "stated"))].filter((o) => o !== "stated");
        html += `<div class="belief"><div class="head"><span class="pred">${esc(pred.replace(/_/g, " "))}</span>
            <span class="now">${current ? esc(current.object) : `<span style="color:var(--muted);font-weight:400">nothing holds now</span>`}</span>
            ${current && current.origin && current.origin !== "stated" ? `<span class="origin ${esc(current.origin)}">${esc(current.origin)}</span>` : ""}
            <span class="spacer"></span>
            <details class="actions"><summary>actions</summary><div class="menu">
              ${facts.filter((f) => f.status === "active" && !f.excluded_reason).map((f) => `<button data-close="${f.fact_id}">Close “${esc(f.object)}” with a reason</button>`).join("")}
              ${facts.filter((f) => !f.excluded_reason).map((f) => `<button data-exclude="${f.fact_id}">Exclude “${esc(f.object)}” from recall</button>`).join("")}
              ${facts.filter((f) => f.excluded_reason).map((f) => `<button data-include="${f.fact_id}">Include “${esc(f.object)}” again</button>`).join("")}
            </div></details></div>
          <div class="timeline">${segs}</div>
          <div class="legend"><span>${esc(day(facts[0].valid_from))}</span><span>${origins.length ? "origin: " + esc(origins.join(", ")) : ""}</span><span>now</span></div>${notes}</div>`;
      }
    }
    show(html);
  } catch (e) { fail(e); }
}

/* ---------- review ---------- */
async function review() {
  const g = gen;
  setHead("Review", "Claims a model read out of your memory. Nothing here counts until you approve it.");
  try {
    const r = await api("/v1/facts?status=proposed");
    if (stale(g)) return;
    const list = r.facts || [];
    updateReviewCount(list.length);
    if (!list.length) return show(`<p class="empty">Nothing awaits review.</p>`);
    const excerpts = {};
    await Promise.all([...new Set(list.map((f) => f.source_episode_id).filter((x) => x != null))].map(async (id) => {
      try { excerpts[id] = await api("/v1/episodes/" + id); } catch (_) { excerpts[id] = null; }
    }));
    if (stale(g)) return;
    show(`<div class="rows">` + list.map((f) => {
      const ep = f.source_episode_id != null ? excerpts[f.source_episode_id] : null;
      return `<div class="proposal">
        <div><div class="triple"><b>${esc(f.subject)}</b> <span style="color:var(--muted)">${esc(f.predicate.replace(/_/g, " "))}</span> ${esc(f.object)}</div>
          <div class="sub">${esc(f.origin)} · confidence ${Number(f.confidence).toFixed(2)} (the model's number, not calibrated) · from ${esc(day(f.valid_from))}</div></div>
        <div class="decide"><button class="btn small" data-approve="${f.fact_id}">Approve</button><button class="btn small danger" data-decline="${f.fact_id}">Decline</button></div>
        ${ep ? `<div class="excerpt"><span class="label">source excerpt, episode #${ep.episode_id}, ${esc(day(ep.created_at))}</span>${esc(ep.content.slice(0, 600))}${ep.content.length > 600 ? "…" : ""}</div>`
             : `<div class="excerpt"><span class="label">source</span>${f.source_episode_id != null ? "episode #" + f.source_episode_id + " is no longer available" : "no episode recorded for this proposal"}</div>`}
      </div>`;
    }).join("") + "</div>");
  } catch (e) { fail(e); }
}
async function updateReviewCount(n) {
  const el = document.getElementById("review-count");
  if (n == null) { try { n = ((await api("/v1/facts?status=proposed")).facts || []).length; } catch (_) { return; } }
  el.textContent = n; el.hidden = !n;
}

/* ---------- live ---------- */
const summarise = (e) => {
  const p = e.payload || {};
  switch (e.kind) {
    case "recall": { const top = (p.items || [])[0]; const lanes = top && top.lanes ? Object.keys(top.lanes).join(" and ") : "no";
      return `recall ${p.query_hashed ? "(query hashed)" : esc(p.query)}: ${(p.items || []).length} excerpt(s), top via ${lanes} lane${p.latency_ms && p.latency_ms.total != null ? `, ${p.latency_ms.total.toFixed(1)} ms` : ""}${p.degraded && p.degraded.length ? `, degraded: ${esc(p.degraded.join("; "))}` : ""}`; }
    case "remember": return `stored ${p.fresh ?? "?"} new, ${p.deduplicated ?? 0} already known, ${p.chunks ?? 0} chunk(s), ${p.bytes ?? 0} B${p.latency_ms != null ? `, ${Number(p.latency_ms).toFixed(1)} ms` : ""}`;
    case "fact_assert": return `belief ${esc(p.subject)} ${esc((p.predicate || "").replace(/_/g, " "))}: ${esc(p.outcome)}${p.origin && p.origin !== "stated" ? ` (${esc(p.origin)})` : ""}${p.superseded && p.superseded.length ? `, superseded #${p.superseded.join(", #")}` : ""}`;
    case "fact_close": return `belief #${p.fact_id} closed by a person`;
    case "fact_review": return `proposal #${p.fact_id} ${esc(p.decision)}${p.of ? ` of #${p.of}` : ""}`;
    case "fact_exclude": return `belief #${p.fact_id} ${p.action === "exclude" ? "excluded from recall" : "included again"}`;
    case "forget": return `episode #${p.episode_id} forgotten, ${p.chunks_removed ?? 0} chunk(s) removed`;
    case "feedback": return `recall #${p.recall_event_id}, chunk #${p.chunk_id} marked ${p.useful ? "useful" : "not useful"}`;
    default: return esc(JSON.stringify(p)).slice(0, 160);
  }
};
const stateOf = (e) => { const p = e.payload || {}; if (e.kind === "job") return p.status === "running" ? ["run", "running"] : p.status === "failed" ? ["bad", "failed"] : ["ok", "completed"]; return p.error ? ["bad", "failed"] : ["ok", "completed"]; };
let liveTimer = null, livePaused = false, liveKind = "", liveLast = null, liveErr = null, liveData = null, liveInFlight = false;
async function livePoll() {
  if (view !== "live" || livePaused || liveInFlight) return;
  const g = gen;
  liveInFlight = true;
  try { const params = new URLSearchParams({ limit: "80" }); if (liveKind) params.set("kind", liveKind);
    const data = await api("/v1/events?" + params.toString());
    if (stale(g)) return;
    liveData = data; liveLast = new Date(); liveErr = null; }
  catch (e) { if (stale(g) || e.message === "key needed") return; liveErr = e.message; }
  finally { liveInFlight = false; }
  renderLive();
}
function renderLive() {
  if (view !== "live") return;
  setHead("Live", "What the engine is doing, as it happens.");
  const r = liveData;
  const head = `<div class="statusline"><span><span class="dot ${liveErr ? "off" : ""}"></span>${liveErr ? "disconnected, " + esc(liveErr) : "connected"}</span>
    <span>polling every 3 s${liveLast ? ", updated " + Math.round((Date.now() - liveLast) / 1000) + " s ago" : ""}</span>
    <button class="btn small quiet" id="pause">${livePaused ? "Resume" : "Pause"}</button>
    <select id="kind"><option value="">all kinds</option>${["recall","remember","fact_assert","fact_review","fact_exclude","fact_close","forget","feedback","job"].map((k) => `<option ${k === liveKind ? "selected" : ""}>${k}</option>`).join("")}</select>
    ${r ? `<span>evidence in ${esc(r.evidence)}, queries ${r.queries_recorded === "hash" ? "hashed" : "recorded"}, newest 80</span>` : ""}</div>`;
  if (!r) { show(head + `<p class="empty">Waiting for the connection.</p>`); return wire(); }
  const events = r.events || [];
  if (!events.length) { show(head + `<p class="empty">No activity recorded yet. Recall or store something and it appears here within a few seconds.</p>`); return wire(); }
  const jobs = new Map();
  const rows = [];
  let minute = null;
  for (const e of events) {
    if (e.kind === "job") { if (!jobs.has(e.payload.job_id)) jobs.set(e.payload.job_id, e); continue; }
    const m = e.ts.slice(0, 16);
    if (m !== minute) { minute = m; rows.push(`<div class="minute">${esc(day(e.ts))} ${esc(e.ts.slice(11, 16))}</div>`); }
    const [cls, label] = stateOf(e);
    rows.push(`<div class="ev"><span class="t">${esc(clock(e.ts))}</span><span class="k">${esc(e.kind.replace(/_/g, " "))}</span><span class="d">${summarise(e)}${cls === "bad" ? `<span class="state bad">${label}${e.payload.error ? ": " + esc(e.payload.error) : ""}</span>` : ""}</span></div>`);
  }
  const jobsHtml = jobs.size ? `<div class="jobs"><h3>Jobs</h3>` + [...jobs.values()].map((e) => { const p = e.payload, [cls, label] = stateOf(e);
    return `<div class="job"><span class="name">${esc(p.name)} <span class="state ${cls}">${label}</span></span><span class="prog">${p.progress ? `${p.progress.done} / ${p.progress.total}` : ""}</span>
      <span class="sub">${esc(p.job_id)}${p.adapter ? ", " + esc(p.adapter) : ""}${p.product ? ", " + esc(p.product) : ""}, last report ${esc(clock(e.ts))}${p.detail ? " · " + esc(p.detail) : ""}${p.error ? ` · <span class="err">${esc(p.error)}</span>` : ""}</span></div>`; }).join("") + `</div>` : "";
  show(head + jobsHtml + rows.join(""));
  wire();
  function wire() {
    const b = document.getElementById("pause"); if (b) b.onclick = () => { livePaused = !livePaused; if (!livePaused) livePoll(); else renderLive(); };
    const k = document.getElementById("kind"); if (k) k.onchange = () => { liveKind = k.value; livePoll(); };
  }
}
async function live() { if (liveTimer) clearInterval(liveTimer); await livePoll(); liveTimer = setInterval(livePoll, 3000); }

/* ---------- analytics ---------- */
const fmt = (m) => {

  if (typeof m.value === "object") return esc(Object.entries(m.value).map(([k, v]) => `${k} ${typeof v === "number" ? v.toFixed(3) : typeof v === "object" ? JSON.stringify(v) : v}`).join(" · "));

};
const label = (name) => name.split(".").slice(1).join(" ").replace(/_/g, " ").replace("latency ms ", "latency ").replace("top item ", "top excerpt via ").replace(" share", "").replace("top similarity ", "top similarity, ");
const fig = (m) => m ? `<div class="fig" title="${esc(m.definition)}${m.caveat ? "\n" + esc(m.caveat) : ""}"><span class="l">${esc(label(m.name))}</span><span class="v">${fmt(m)}</span><span class="n">n = ${m.n} ${esc(m.denominator)}</span></div>` : "";

    </div>

      <span><b>${cov.events_considered}</b> events considered</span><span>from <b>${esc((cov.earliest_retained || "").slice(0, 16))}</b></span>
      <span>to <b>${esc((cov.latest || "").slice(0, 16))}</b></span><span>${cov.truncated ? `<span class="err">read truncated, coverage partial</span>` : "read complete"}</span>
      <span>failures: <b>${esc(Object.entries(r.failures || {}).map(([k, v]) => k + " " + v).join(", ") || "none")}</b></span>

      <div class="legend"><span>${esc(days[0][0])}</span><span>events per day</span><span>${esc(days[days.length - 1][0])}</span></div>` : ""}`);

/* ---------- scopes, status ---------- */
async function scopes() {

    show(keys.map(([key, values]) => { const max = Math.max(...Object.values(values));
      return `<div class="panel" style="margin-bottom:16px"><h3>${esc(key.replace(/_/g, " "))}</h3><div class="sub">${Object.keys(values).length} value(s), choose one to search within it</div><div class="kv">` +
        Object.entries(values).map(([v, n]) => `<button class="linkish" style="text-align:left" data-where="${esc(key)}:${esc(v)}">${esc(v)}</button><div class="bar"><i style="width:${Math.round((n / max) * 100)}%"></i></div><span style="color:var(--muted)">${n}</span>`).join("") + "</div></div>"; }).join(""));
  } catch (e) { fail(e); }
}
async function status() {
  const g = gen;
  setHead("Status", "What this server runs on and how much it holds.");
  try {
    const r = await api("/v1/status");
    if (stale(g)) return;
    show(`<div class="flow"><span class="node">episodes<small>${esc(r.episodes)} stored, ${esc(r.chunks)} chunks</small></span><span class="arrow">→</span>
      <span class="node">${esc(r.embedder)}<small>embedder</small></span><span class="arrow">→</span><span class="node">${esc(r.vector_index)}<small>vector index</small></span>
      <span class="arrow">+</span><span class="node">${esc(r.document_store)}<small>documents, facts, text lane</small></span></div>
      <div class="panel">${[["Space", r.space], ["Episodes", r.episodes], ["Chunks", r.chunks], ["Stored bytes", r.bytes], ["Awaiting review", r.pending_review], ["Revision", r.revision],
        ["Facts", r.semantic_lane === "manual" ? "asserted by people and agents; no distiller configured on this server" : r.semantic_lane]]
        .map(([k, v]) => `<div class="stat"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("")}</div>`);
  } catch (e) { fail(e); }
}

/* ---------- shell ---------- */
const views = {
  search: () => (state.q || Object.keys(state.where).length || state.tags.length || state.asOf) ? runSearch() : searchShell(`<p class="empty">Ask a question, or press Enter to see the most recent memory.</p>`),
  beliefs, review, live, analytics, scopes, status,
};
function activate(name) {
  if (!views[name]) name = "search";
  if (liveTimer && name !== "live") { clearInterval(liveTimer); liveTimer = null; }
  view = name;
  gen += 1;
  document.querySelectorAll("button.nav").forEach((b) => b.setAttribute("aria-current", String(b.dataset.view === name)));
  if (location.hash !== "#" + name) history.replaceState(null, "", location.pathname + location.search + "#" + name);
  closeNav();
  if (!TOKEN) return askKey();
  views[name]();
}
document.querySelectorAll("button.nav").forEach((b) => { b.onclick = () => activate(b.dataset.view); });
const side = document.getElementById("side"), scrim = document.getElementById("scrim");
const menuBtn = document.getElementById("menu"), mainEl = document.querySelector("main");
const closeNav = () => {
  if (!side.classList.contains("open")) return;
  side.classList.remove("open"); scrim.classList.remove("open"); mainEl.inert = false; menuBtn.setAttribute("aria-expanded", "false"); menuBtn.focus();
};
const openNav = () => {
  side.classList.add("open"); scrim.classList.add("open"); mainEl.inert = true; menuBtn.setAttribute("aria-expanded", "true");
  const current = side.querySelector('button.nav[aria-current="true"]') || side.querySelector("button.nav"); if (current) current.focus();
};
menuBtn.setAttribute("aria-expanded", "false"); menuBtn.setAttribute("aria-controls", "side");
menuBtn.onclick = () => (side.classList.contains("open") ? closeNav() : openNav());
scrim.onclick = closeNav;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });

out.addEventListener("click", async (e) => {
  const rmW = e.target.closest("[data-rm-where]"); if (rmW) { delete state.where[rmW.dataset.rmWhere]; return runSearch(); }
  const rmT = e.target.closest("[data-rm-tag]"); if (rmT) { state.tags = state.tags.filter((t) => t !== rmT.dataset.rmTag); return runSearch(); }
  if (e.target.closest("[data-rm-asof]")) { state.asOf = ""; return runSearch(); }
  const w = e.target.closest("[data-where]"); if (w) { const [k, v] = w.dataset.where.split(":"); state.where[k] = v; return activate("search"); }
  const tg = e.target.closest("[data-tag]"); if (tg) { if (!state.tags.includes(tg.dataset.tag)) state.tags.push(tg.dataset.tag); return runSearch(); }
  const fb = e.target.closest("[data-fb]");
  if (fb) { try { await api("/v1/feedback", { method: "POST", body: JSON.stringify({ recall_event_id: Number(fb.dataset.ev), chunk_id: Number(fb.dataset.chunk), useful: fb.dataset.fb === "1" }) });
      fb.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("set", b === fb)); } catch (err) { fail(err); } return; }
  const act = e.target.closest("[data-close],[data-exclude],[data-include],[data-approve],[data-decline]");
  if (!act) return;
  const id = act.dataset.close || act.dataset.exclude || act.dataset.include || act.dataset.approve || act.dataset.decline;
  let path, body = null;
  if (act.dataset.close) { const reason = prompt("Why did this stop holding?"); if (!reason) return; path = "close"; body = { reason }; }
  else if (act.dataset.exclude) { const reason = prompt("Why hide this from recall? Its history is kept."); if (!reason) return; path = "exclude"; body = { reason }; }
  else if (act.dataset.include) path = "include";
  else if (act.dataset.approve) path = "approve";
  else { const reason = prompt("Why decline this proposal?"); if (!reason) return; path = "decline"; body = { reason }; }
  act.disabled = true;
  try { await api(`/v1/facts/${encodeURIComponent(id)}/${path}`, { method: "POST", body: body ? JSON.stringify(body) : undefined }); activate(view); updateReviewCount(); }
  catch (err) { act.disabled = false; fail(err); }
});

const params = new URLSearchParams(location.search);
if (params.get("scheme") === "light" || params.get("scheme") === "dark") document.documentElement.dataset.scheme = params.get("scheme");
if (params.get("q")) state.q = params.get("q");
if (params.get("where")) for (const pair of params.get("where").split(",")) { const [k, v] = pair.split(":"); if (k && v) state.where[k] = v; }
// The playground is a separate page served by this host when its asset is
// packaged; show the link only when it answers, never a dead entry.
fetch("/playground", { method: "HEAD" }).then((r) => { if (r.ok) document.getElementById("playground-link").hidden = false; }).catch(() => {});
api("/v1/status").then((r) => { document.getElementById("space").textContent = r.space; document.getElementById("topspace").textContent = r.space;
  document.getElementById("foot").textContent = `${r.document_store} · ${r.vector_index} · ${r.embedder}`; updateReviewCount(r.pending_review); }).catch(() => {});
activate(location.hash.slice(1) || "search");
</script>
</body>
