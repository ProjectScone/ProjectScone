[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scone-memory"
version = "0.1.0"
description = "Temporal memory engine for agents: episodes, chunks, and dated facts over pluggable stores (in-process, MongoDB, Qdrant), served by FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ProjectScone contributors" }]
keywords = ["memory", "agents", "retrieval", "temporal", "qdrant", "mongodb", "fastapi"]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
mongo = ["pymongo>=4.13"]
qdrant = ["qdrant-client>=1.12"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=2,<3"]
remote-embed = ["httpx>=0.27"]
local-embed = ["fastembed>=0.4"]
all = ["scone-memory[mongo,qdrant,api,mcp,remote-embed,local-embed]"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "fastapi>=0.115", "mcp>=2,<3"]

[project.scripts]
scone-memory = "scone_memory.cli:main"
scone-memory-mcp = "scone_memory.mcp:main"

[project.urls]
Homepage = "https://github.com/DrDrewCain/ProjectScone"
Source = "https://github.com/DrDrewCain/ProjectScone/tree/main/python/scone-memory"

[tool.setuptools.packages.find]
include = ["scone_memory*"]

[tool.setuptools.package-data]
"scone_memory.api" = ["console.html", "playground.html", "scone-mark.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mongo: needs a live MongoDB at SCONE_TEST_MONGO_URL",
    "qdrant: needs a live Qdrant at SCONE_TEST_QDRANT_URL",
]
