[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scone-memory"
version = "0.1.0"
description = "Memory infrastructure for LLMs, RAG and agents: verbatim episodes, a dated fact ledger, hybrid recall and an evidence log over pluggable stores (SQLite, MongoDB, PostgreSQL, Qdrant, Redis, Chroma, LanceDB), served by FastAPI and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ProjectScone contributors" }]
keywords = ["memory", "agents", "retrieval", "rag", "temporal", "knowledge", "qdrant", "mongodb", "postgres", "pgvector", "redis", "chroma", "lancedb", "fastapi", "mcp", "langchain", "llamaindex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
mongo = ["pymongo>=4.13"]
qdrant = ["qdrant-client>=1.12"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=2,<3"]
remote-embed = ["httpx>=0.27"]
local-embed = ["fastembed>=0.4"]
postgres = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
redis = ["redis>=5"]
elasticsearch = ["elasticsearch>=8,<9"]
milvus = ["pymilvus>=2.5"]
milvus-lite = ["pymilvus[milvus_lite]>=2.5"]
chroma = ["chromadb>=1.0"]
lancedb = ["lancedb>=0.20"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
openai-agents = ["openai-agents>=0.2"]
all = ["scone-memory[mongo,qdrant,postgres,redis,elasticsearch,milvus,chroma,lancedb,api,mcp,remote-embed,local-embed]"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "fastapi>=0.115", "mcp>=2,<3"]

[project.scripts]
scone-memory = "scone_memory.cli:main"
scone-memory-mcp = "scone_memory.mcp:main"

[project.urls]
Homepage = "https://github.com/DrDrewCain/ProjectScone"
Source = "https://github.com/DrDrewCain/ProjectScone/tree/main/python/memory"
Issues = "https://github.com/DrDrewCain/ProjectScone/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scone_memory*"]

[tool.setuptools.package-data]
"scone_memory" = ["py.typed"]
"scone_memory.api" = ["console.html", "playground.html", "scone-mark.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mongo: needs a live MongoDB at SCONE_TEST_MONGO_URL",
    "qdrant: needs a live Qdrant at SCONE_TEST_QDRANT_URL",
    "postgres: needs a live PostgreSQL with pgvector at SCONE_TEST_POSTGRES_URL",
    "redis: needs a live Redis with RediSearch at SCONE_TEST_REDIS_URL",
    "elasticsearch: needs a live Elasticsearch 8 at SCONE_TEST_ELASTICSEARCH_URL",
]
