name: Build native workspace assets
description: Verify React sources and embed fresh assets before native compilation or packaging
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: pnpm/action-setup@v4
      with:
        version: '9.9.0'
    - name: Install locked frontend dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/Webapp
      run: pnpm install --frozen-lockfile
    - name: Test and package workspace
      shell: bash
      working-directory: ${{ github.workspace }}/Webapp
      run: |
        pnpm test
        pnpm build
        pnpm check:assets
