name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: ~/.scone/models--Xenova--bge-small-en-v1.5
          key: embed-model-bge-small-en-v1.5
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/scone-memory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e '.[test,qdrant,mongo,langchain,llamaindex,openai-agents]'
      - name: Tests
        run: python -m pytest -q -p no:warnings
