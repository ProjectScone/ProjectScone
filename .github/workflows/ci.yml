name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: ~/.scone/models--Xenova--bge-small-en-v1.5
          key: embed-model-bge-small-en-v1.5
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/scone-memory
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scone
          POSTGRES_PASSWORD: scone
          POSTGRES_DB: scone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e '.[test,qdrant,mongo,postgres,redis,chroma,lancedb,langchain,llamaindex,openai-agents]'
      - name: Tests
        env:
          SCONE_TEST_POSTGRES_URL: postgresql://scone:scone@localhost:5432/scone
          SCONE_TEST_REDIS_URL: redis://localhost:6379
        run: python -m pytest -q -p no:warnings
