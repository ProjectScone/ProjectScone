name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    name: Terraform configuration and recovery guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      CHECKPOINT_DISABLE: "1"
      TF_IN_AUTOMATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-provider-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Check deployment helper types
        run: |
          python -m pip install mypy==2.3.1
          python -m mypy --strict scripts/terraform_env.py terraform/modules/compute/mount_volume.py
      - name: Test private environment handling
        run: python -m unittest discover -s scripts -p test_terraform_env.py
      - name: Test Qdrant volume identity and mount guards
        run: python -m unittest discover -s terraform/modules/compute/tests -p test_mount_volume.py
      - name: Check storage foundation with a mock provider
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate
          terraform -chdir=terraform test
      - name: Check compute with a mock provider
        run: |
          terraform -chdir=terraform/modules/compute init -backend=false -input=false
          terraform -chdir=terraform/modules/compute validate
          terraform -chdir=terraform/modules/compute test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-webapp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: ~/.scone/models--Xenova--bge-small-en-v1.5
          key: embed-model-bge-small-en-v1.5
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  episode-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic Rust probe and run shared fixtures
        # No model download: this profile uses HashEmbedder in both runtimes.
        run: |
          cargo test --locked -p scone-core --no-default-features --test shared_contract
          cargo build --locked -p scone-core --no-default-features --example episode_roundtrip
      - name: Install Python conformance dependencies
        run: python -m pip install -e './python/memory[test]'
      - name: Exchange real exports in both directions
        working-directory: python/memory
        env:
          SCONE_TEST_RUST_ROUNDTRIP: ${{ github.workspace }}/target/debug/examples/episode_roundtrip
        run: python -m pytest -q tests/test_cross_language.py -k 'memory or sqlite or probe'

  client:
    # The HTTP client is published separately and claims Python 3.9, so it
    # is built and tested on the oldest version it claims as well as 3.14.
    # Nothing here needs a production server: the tests run
    # against a stub, and the integration ones skip when no binary exists.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    defaults:
      run:
        working-directory: python/scone-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -q -e '.[test]'
      - name: Tests
        run: python -m pytest -q -p no:warnings
      - name: Package
        # Built and checked the way PyPI would; nothing is uploaded.
        run: |
          python -m pip install -q build twine
          python -m build -q
          python -m twine check dist/*

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/memory
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scone
          POSTGRES_PASSWORD: scone
          POSTGRES_DB: scone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-webapp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -e '.[test,qdrant,mongo,postgres,redis,elasticsearch,milvus-lite,chroma,lancedb,langchain,llamaindex,openai-agents,pipecat]'
          python -m pip install -q faiss-cpu langchain-community  # a real third-party store for the LangChain bridge's contract run
      - name: Tests
        env:
          SCONE_TEST_POSTGRES_URL: postgresql://scone:scone@localhost:5432/scone
          SCONE_TEST_REDIS_URL: redis://localhost:6379
          SCONE_TEST_ELASTICSEARCH_URL: http://localhost:9200
        run: python -m pytest -q -p no:warnings
      - name: Package
        # Build the sdist and wheel and check their metadata the way PyPI
        # would; nothing is uploaded.
        run: |
          python -m pip install -q build twine
          python -m build -q
          python -m twine check dist/*

  python-314:
    name: Python 3.14 and AWS storage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/memory
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        env:
          DDB_LOCAL_TELEMETRY: "0"
        ports:
          - 8000:8000
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install runtime and emulator test dependencies
        run: python -m pip install -q -e '.[test,aws-test,qdrant,mongo,vision]' mypy
      - name: Test with disposable MongoDB and AWS emulators
        env:
          SCONE_TEST_MONGO_URL: mongodb://localhost:27017
          SCONE_TEST_DYNAMODB_URL: http://127.0.0.1:8000
        run: python -m pytest -q -p no:warnings
      - name: Check new AWS backend types
        run: python -m mypy --follow-imports=silent --strict src/scone_memory/backends/aws_blobs.py src/scone_memory/api/page_access.py
