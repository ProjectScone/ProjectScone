name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: ~/.scone/models--Xenova--bge-small-en-v1.5
          key: embed-model-bge-small-en-v1.5
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  episode-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic Rust probe and run shared fixtures
        # No model download: this profile uses HashEmbedder in both runtimes.
        run: |
          cargo test --locked -p scone-core --no-default-features --test shared_contract
          cargo build --locked -p scone-core --no-default-features --example episode_roundtrip
      - name: Install Python conformance dependencies
        run: python -m pip install -e './python/memory[test]'
      - name: Exchange real exports in both directions
        working-directory: python/memory
        env:
          SCONE_TEST_RUST_ROUNDTRIP: ${{ github.workspace }}/target/debug/examples/episode_roundtrip
        run: python -m pytest -q tests/test_cross_language.py -k 'memory or sqlite or probe'

  client:
    # The HTTP client is published separately and claims Python 3.9, so it
    # is built and tested on the oldest version it claims as well as the
    # one everything else uses. Nothing here needs a server: the tests run
    # against a stub, and the integration ones skip when no binary exists.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: python/scone-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -q -e '.[test]'
      - name: Tests
        run: python -m pytest -q -p no:warnings
      - name: Package
        # Built and checked the way PyPI would; nothing is uploaded.
        run: |
          python -m pip install -q build twine
          python -m build -q
          python -m twine check dist/*

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/memory
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scone
          POSTGRES_PASSWORD: scone
          POSTGRES_DB: scone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -e '.[test,qdrant,mongo,postgres,redis,elasticsearch,milvus-lite,chroma,lancedb,langchain,llamaindex,openai-agents,pipecat]'
          python -m pip install -q faiss-cpu langchain-community  # a real third-party store for the LangChain bridge's contract run
      - name: Tests
        env:
          SCONE_TEST_POSTGRES_URL: postgresql://scone:scone@localhost:5432/scone
          SCONE_TEST_REDIS_URL: redis://localhost:6379
          SCONE_TEST_ELASTICSEARCH_URL: http://localhost:9200
        run: python -m pytest -q -p no:warnings
      - name: Package
        # Build the sdist and wheel and check their metadata the way PyPI
        # would; nothing is uploaded.
        run: |
          python -m pip install -q build twine
          python -m build -q
          python -m twine check dist/*
