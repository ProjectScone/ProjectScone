name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p scone-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          STAGE="scone-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/scone" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          cp crates/scone-ffi/include/scone.h "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: scone-*.tar.gz
