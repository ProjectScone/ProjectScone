name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p scone-cli --target ${{ matrix.target }}
      - name: Build mac x86_64 too
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release -p scone-cli --target x86_64-apple-darwin
      - name: Package
        run: |
          package() {
            STAGE="scone-${GITHUB_REF_NAME}-$1"
            mkdir -p "$STAGE"
            cp "target/$1/release/scone" "$STAGE/"
            cp LICENSE README.md "$STAGE/"
            cp crates/scone-ffi/include/scone.h "$STAGE/"
            tar czf "$STAGE.tar.gz" "$STAGE"
          }
          package "${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            package x86_64-apple-darwin
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: scone-*.tar.gz
