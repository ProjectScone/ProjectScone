[package]
name = "scone-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for the Scone memory engine — embed persistent temporal memory in any language"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["local-embed"]
local-embed = ["scone-core/local-embed"]

[dependencies]
scone-core = { path = "../scone-core", version = "0.2.1", default-features = false }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
