[package]
name = "scone-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Scone memory engine: episodic + temporal-fact dual store with hybrid recall, offline-first"
readme = "../../README.md"

[features]
default = ["local-embed"]
local-embed = ["dep:fastembed"]

[dependencies]
blake3 = "1"
fastembed = { version = "6", optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tantivy = "0.26"
usearch = "2.26"
thiserror = "2"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[bench]]
name = "engine"
harness = false
