[package]
name = "scone-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scone: a local-first temporal memory engine — CLI, MCP server, and HTTP API"
readme = "../../README.md"

[lib]
name = "scone"

[[bin]]
name = "scone"
path = "src/main.rs"

[features]
default = ["local-embed", "pdf"]
local-embed = ["scone-core/local-embed"]
pdf = ["scone-core/pdf"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "net"] }
htmd = "0.2"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
toml = "0.9"
blake3 = "1"
scone-core = { path = "../scone-core", version = "0.2.1", default-features = false }

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "3", features = ["client", "transport-async-rw"] }
rusqlite = { version = "0.40", features = ["bundled"] }
predicates = "3"
tempfile = "3"
