[package]
name = "scone"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["local-embed"]
local-embed = ["scone-core/local-embed"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.9"
scone-core = { path = "../scone-core", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
