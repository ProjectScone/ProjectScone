<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Scone · Memory</title>
<style>
  :root { --bg:#f7f6f3; --surface:#fff; --line:#e4e0d8; --ink:#1c1a17; --muted:#6b665d; --accent:#8a5a2b; --accent-soft:#f1eadf; --ok:#2f6b3a; --warn:#8a2b2b; --on-accent:#fff; }
  @media(prefers-color-scheme:dark) { :root { --bg:#14130f; --surface:#1d1c18; --line:#2f2c26; --ink:#ebe7df; --muted:#9c958a; --accent:#d9a066; --accent-soft:#2a251e; --ok:#8cc79a; --warn:#e08585; --on-accent:#14130f; }}
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,input { font:inherit; color:inherit; } button { cursor:pointer; } button:disabled { cursor:wait; opacity:.55; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
  a { color:var(--accent); text-underline-offset:3px; }
  .skip { position:fixed; top:-80px; left:16px; z-index:10; padding:12px; background:var(--surface); } .skip:focus { top:12px; }
  .sidebar { position:fixed; inset:0 auto 0 0; width:220px; padding:32px 20px 24px; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:12px; padding:0 12px; font-size:20px; font-weight:600; letter-spacing:-.6px; }
  .brand svg { width:28px; height:28px; color:var(--accent); }
  nav { margin-top:40px; } .nav-group { margin-bottom:32px; }
  .nav-group h2,.eyebrow { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .nav-group h2 { margin:0 12px 12px; }
  nav button { display:flex; align-items:center; gap:12px; width:100%; border:0; border-radius:6px; padding:10px 12px; margin:4px 0; text-align:left; background:transparent; color:var(--muted); }
  nav button:hover { background:var(--surface); color:var(--ink); }
  nav button[aria-current="page"] { color:var(--accent); background:var(--accent-soft); font-weight:600; }
  nav svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; flex-shrink:0; }
  .sidebar-foot { margin-top:auto; padding:16px 12px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  .sidebar-foot strong { display:block; color:var(--ink); font-weight:600; margin-bottom:4px; }
  .workspace { margin-left:220px; }
  .topbar { min-height:72px; padding:16px 40px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; align-items:center; color:var(--muted); font-size:12px; }
  .breadcrumb { display:flex; gap:12px; align-items:center; } .breadcrumb span:last-child { color:var(--ink); }
  .space-context { display:flex; gap:8px; align-items:center; min-width:0; }
  #space { color:var(--ink); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { padding:40px 40px 64px; max-width:1000px; margin:0 auto; }
  .page-heading { margin-bottom:32px; } .eyebrow { margin:0 0 8px; }
  h1 { font-size:28px; font-weight:600; line-height:1.25; letter-spacing:-.8px; margin:0 0 12px; }
  .intro { color:var(--muted); margin:0; max-width:620px; } h2 { font-size:16px; font-weight:600; margin:0 0 16px; } p { margin:0 0 12px; }
  .searchbox { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 8px 8px 16px; }
  .searchbox:focus-within { border-color:var(--accent); } .searchbox svg { width:20px; height:20px; flex-shrink:0; color:var(--muted); }
  #q { min-width:0; flex:1; border:0; outline:0; background:transparent; height:40px; font-size:15px; }
  .primary { border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:var(--on-accent); padding:10px 20px; font-weight:600; }
  .filters { display:flex; align-items:end; flex-wrap:wrap; gap:12px; margin:16px 0 8px; } label { display:block; font-size:12px; color:var(--muted); }
  .filters input { display:block; width:172px; height:36px; margin-top:4px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; font-size:13px; }
  .quiet { padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--muted); font-size:12px; }
  .quiet:hover { background:var(--surface); color:var(--ink); }
  #filter-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:4px 8px; font-size:12px; color:var(--muted); }
  #out { margin-top:32px; }
  .empty { border:1px dashed var(--line); border-radius:8px; padding:48px 24px; text-align:center; }
  .empty svg { width:32px; height:32px; color:var(--muted); margin-bottom:16px; } .empty h2 { margin-bottom:8px; } .empty p { color:var(--muted); max-width:420px; margin:0 auto; }
  .result-count { display:flex; justify-content:space-between; gap:16px; align-items:baseline; margin-bottom:16px; font-size:12px; color:var(--muted); } .result-count strong { color:var(--ink); font-size:14px; font-weight:600; }
  .result-list { border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow:hidden; }
  .result { padding:24px; border-bottom:1px solid var(--line); } .result:last-child { border-bottom:0; }
  .meta { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px; font-size:12px; color:var(--muted); margin-bottom:12px; overflow-wrap:anywhere; } .meta a { color:var(--muted); }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.75; }
  .result details { margin-top:16px; font-size:12px; color:var(--muted); } summary { cursor:pointer; width:fit-content; padding:4px 0; } details[open] summary { margin-bottom:12px; }
  .detail-grid { display:grid; grid-template-columns:120px minmax(0,1fr); gap:8px 16px; margin:0; } dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  .note { color:var(--muted); font-size:12px; margin:16px 0 0; }
  .notice { border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:6px; padding:16px; margin-bottom:24px; } .notice p { color:var(--muted); }
  .belief-group { margin-bottom:32px; } .belief-head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:12px; }
  .belief-value { font-size:16px; font-weight:600; margin-bottom:12px; overflow-wrap:anywhere; } .belief-predicate { color:var(--muted); font-size:12px; }
  .validity { border-left:2px solid var(--accent); padding-left:12px; font-size:12px; color:var(--muted); } .closed .validity { border-left-style:dashed; border-color:var(--muted); }
  .state { font-size:12px; color:var(--muted); text-transform:capitalize; } .state.active { color:var(--ok); }
  .actions { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:16px; } .danger { color:var(--warn); }
  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:24px; }
  .stat-card { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:24px; } .stat-card span { display:block; font-size:12px; color:var(--muted); } .stat-card strong { display:block; font-size:28px; font-weight:600; margin-top:8px; font-variant-numeric:tabular-nums; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:24px; }
  .tag-list { display:flex; flex-wrap:wrap; gap:12px; } .tag-button { border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:12px 16px; } .tag-button span { margin-left:16px; color:var(--muted); font-size:12px; }
  dialog { width:min(480px,calc(100% - 32px)); border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); padding:32px; } dialog::backdrop { background:rgb(0 0 0 / .45); }
  dialog input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:12px; margin:8px 0 24px; } dialog .actions { justify-content:flex-end; }
  @media(max-width:760px) {
    .sidebar { position:static; width:auto; padding:20px 20px 12px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { padding:0; font-size:18px; } .brand svg { width:24px; height:24px; }
    nav { margin-top:16px; display:flex; flex-wrap:wrap; gap:4px; } .nav-group { display:contents; } .nav-group h2,.sidebar-foot { display:none; }
    nav button { width:auto; margin:0; padding:10px 12px; min-height:44px; gap:8px; }
    .workspace { margin-left:0; } .topbar { min-height:56px; padding:12px 20px; } #space { max-width:140px; }
    main { padding:28px 20px 40px; } h1 { font-size:24px; } .page-heading { margin-bottom:24px; }
    .searchbox { gap:8px; padding-left:12px; } .searchbox svg { display:none; } .primary { padding:10px 16px; }
    .filters { gap:12px; } .filters label { flex:1; min-width:130px; } .filters input { width:100%; min-width:0; }
    .result { padding:20px; } .result-count { flex-wrap:wrap; gap:4px; } .stats { gap:8px; } .stat-card { padding:16px 12px; } .stat-card strong { font-size:24px; } .detail-grid { grid-template-columns:90px minmax(0,1fr); }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<aside class="sidebar">
  <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><path fill="currentColor" d="M3 3h9v9H3zm13 0h9v9h-9zM3 16h9v9H3z"/><path fill="none" stroke="currentColor" stroke-width="2" d="M17 17h7v7h-7z"/></svg>Scone</div>
  <nav aria-label="Main navigation">
    <div class="nav-group"><h2>Memory</h2>
      <button data-view="search" aria-current="page"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5"/></svg>Search</button>
      <button data-view="facts"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h12v14H4zM7 7h6M7 10h6M7 13h4"/></svg>Beliefs</button>
      <button data-view="profile"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6" r="3"/><path d="M4 17v-2a6 6 0 0 1 12 0v2"/></svg>Profile</button>
    </div>
    <div class="nav-group"><h2>System</h2>
      <button data-view="tags"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h7l7 7-7 7-7-7z"/><circle cx="7" cy="7" r="1"/></svg>Tags</button>
      <button data-view="status"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 11h4l3-7 3 12 2-5h4"/></svg>Status</button>
    </div>
  </nav>
  <div class="sidebar-foot"><strong>Rust engine</strong>Local memory console</div>
</aside>
<div class="workspace">
  <header class="topbar"><div class="breadcrumb"><span>Scone</span><span aria-hidden="true">/</span><span id="crumb">Search</span></div><div class="space-context"><span>Space</span><strong id="space">Connecting…</strong></div></header>
  <main id="main" tabindex="-1">
    <div class="page-heading"><p class="eyebrow" id="section">Your memory</p><h1 id="title">Search</h1><p class="intro" id="description">Find what matters. Follow it back to the source.</p></div>
    <form id="controls">
      <div class="searchbox"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5"/></svg><input type="search" id="q" aria-label="Search memory" placeholder="Search a decision, idea, or conversation…" autocomplete="off" required><button class="primary" id="run">Search</button></div>
      <div class="filters"><label for="tags">Tags<input id="tags" type="text" placeholder="e.g. work, planning" autocomplete="off"></label><label for="asof">As of (UTC)<input id="asof" type="date"></label><button type="button" class="quiet" id="clear-filters">Clear filters</button></div>
      <div id="filter-chips" aria-label="Active filters"></div>
    </form>
    <div id="out" aria-live="polite"></div>
  </main>
</div>
<dialog id="close-dialog" aria-labelledby="close-title"><form id="close-form"><h2 id="close-title">Close belief</h2><p class="intro">End this belief’s validity. Its history and underlying source material remain stored.</p><p id="close-value" class="body"></p><label for="close-reason">Reason</label><input id="close-reason" required maxlength="500" placeholder="What changed?"><p id="close-error" class="danger" role="alert" hidden></p><div class="actions"><button type="button" class="quiet" id="cancel-close">Cancel</button><button class="primary" id="confirm-close">Close belief</button></div></form></dialog>
<script>
const TOKEN = document.currentScript.dataset.token || "__SCONE_TOKEN__";
const $ = id => document.getElementById(id);
const out = $('out'), q = $('q');
let view = 'search', generation = 0, activeRequest = null, closing = null, closeTrigger = null;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number = value => typeof value === 'number' && Number.isFinite(value) ? value.toLocaleString() : 'Not reported';
const date = value => value ? String(value).slice(0,10) : 'Date not recorded';
const titles = {search:['Your memory','Search','Find what matters. Follow it back to the source.'],facts:['Your memory','Beliefs','Inspect recorded claims and how their validity changes over time.'],profile:['Your memory','Profile','A working snapshot of recorded beliefs and recent memory.'],tags:['Organization','Tags','Use a tag to narrow your next search.'],status:['System','Status','Inspect this space and the engine serving it.']};
const empty = (title, text) => `<div class="empty"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true"><rect x="5" y="4" width="22" height="24" rx="3"/><path d="M11 11h10M11 16h10M11 21h6"/></svg><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
function source(value) {
  if (!value) return '<span>Source not recorded</span>';
  try { const url = new URL(value); if (['http:','https:'].includes(url.protocol)) return `<a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${esc(url.hostname + (url.pathname === '/' ? '' : url.pathname))} ↗</a>`; } catch {}
  return `<span>${esc(value)}</span>`;
}
async function api(path, options={}) {
  const response = await fetch(path, {...options, headers:{authorization:'Bearer '+TOKEN,'content-type':'application/json'}});
  const body = await response.json().catch(() => ({}));
  if (!response.ok) { const error = new Error(body.error || `Request failed (${response.status})`); error.status = response.status; throw error; }
  return body;
}
function showError(error) {
  out.removeAttribute('aria-busy');
  if (error.status === 401) $('space').textContent = 'Not authorized';
  out.innerHTML = `<div class="notice" role="alert"><h2>${error.status === 401 ? 'Session unavailable' : 'Could not load this view'}</h2><p>${esc(error.status === 401 ? 'This session key is no longer valid. Reopen the console from your local Scone process.' : error.message)}</p><button class="quiet" data-retry>Try again</button></div>`;
}
async function load(path, render) {
  const own = ++generation;
  if (activeRequest) activeRequest.abort();
  activeRequest = new AbortController();
  out.setAttribute('aria-busy','true'); out.innerHTML='<p class="note">Loading memory…</p>';
  try { const body = await api(path,{signal:activeRequest.signal}); if (own === generation) out.innerHTML=render(body); }
  catch (error) { if (own === generation && error.name !== 'AbortError') showError(error); }
  finally { if (own === generation) out.removeAttribute('aria-busy'); }
}
function filterChips() {
  $('filter-chips').innerHTML = ['tags','asof'].filter(id => $(id).value.trim()).map(id => `<button type="button" class="chip" data-clear="${id}" aria-label="Remove ${id === 'tags' ? 'tags' : 'date'} filter">${id === 'tags' ? 'Tags' : 'As of UTC'}: ${esc($(id).value)} <span aria-hidden="true">×</span></button>`).join('');
}
function search() {
  filterChips();
  if (!q.value.trim()) { ++generation; if (activeRequest) activeRequest.abort(); out.removeAttribute('aria-busy'); out.innerHTML=empty('Your next answer starts here','Search the memory in this space to find relevant excerpts and their sources.'); return; }
  const params = new URLSearchParams({q:q.value.trim(),limit:'25'});
  if ($('tags').value.trim()) params.set('tags',$('tags').value.trim());
  if ($('asof').value) params.set('as_of',$('asof').value+'T00:00:00.000Z');
  load('/v1/recall?'+params, r => {
    const items=r.items || [], facts=r.facts || [];
    const degraded = r.degraded?.length ? `<div class="notice" role="status">Partial retrieval: ${esc(r.degraded.join('; '))}</div>` : '';
    if (!items.length && !facts.length) return degraded+empty('No matching memory','Try a different phrase or remove a filter. No matching evidence was returned.');
    const claims = facts.length ? `<div class="belief-group"><h2>Related recorded claims</h2><div class="result-list">${facts.map(f => `<article class="result"><div class="body"><strong>${esc(f.subject)}</strong> ${esc(f.predicate)} ${esc(f.object)}</div><p class="note">${esc(f.status)} · valid from ${esc(date(f.valid_from))}. A stored claim is not independent verification.</p></article>`).join('')}</div></div>` : '';
    const bytes = typeof r.context_reduction === 'number' ? `${Math.round(r.context_reduction*100)}% of stored bytes omitted · not tokens` : '';
    return degraded+claims+`<div class="result-count"><strong>${items.length} retrieved excerpt${items.length === 1 ? '' : 's'}</strong><span>${esc(bytes)}</span></div><div class="result-list">`+items.map(i => `<article class="result"><div class="meta"><time>${esc(date(i.created_at))}</time>${source(i.source)}<span>Excerpt</span></div><div class="body">${esc(i.text)}</div><details><summary>Retrieval details</summary><dl class="detail-grid"><dt>Episode</dt><dd>${esc(i.episode_id)}</dd><dt>Retrieval score</dt><dd>${typeof i.score === 'number' && Number.isFinite(i.score) ? i.score.toFixed(3) : 'Not reported'}</dd><dt>Recorded time</dt><dd>${esc(i.created_at || 'Not recorded')}</dd></dl><p class="note">A ranking signal, not confidence or proof. This API does not report per-lane attribution.</p></details></article>`).join('')+'</div>';
  });
}
function facts() {
  load('/v1/facts?all=true', r => {
    const list=r.facts || []; if (!list.length) return empty('No recorded beliefs','Beliefs appear here when they are recorded in this space. Source memory can still be searched.');
    const groups=new Map(); for (const f of list) { if (!groups.has(f.subject)) groups.set(f.subject,[]); groups.get(f.subject).push(f); }
    return [...groups].map(([subject, rows]) => `<section class="belief-group"><h2>${esc(subject)}</h2><div class="result-list">${rows.sort((a,b) => String(a.valid_from).localeCompare(String(b.valid_from))).map(f => `<article class="result ${f.status === 'active' ? '' : 'closed'}"><div class="belief-head"><span class="belief-predicate">${esc(f.predicate)}</span><span class="state ${f.status === 'active' ? 'active' : ''}">${esc(f.status)}</span></div><div class="belief-value">${esc(f.object)}</div><div class="validity">${esc(date(f.valid_from))} → ${f.valid_until ? esc(date(f.valid_until)) : 'No end recorded'}</div><div class="actions"><span class="note" style="margin:0">Recorded claim · #${esc(f.fact_id)}</span>${f.status === 'active' ? `<button class="quiet danger" data-close="${esc(f.fact_id)}" data-value="${esc(subject+' '+f.predicate+' '+f.object)}">Close belief</button>` : ''}</div></article>`).join('')}</div></section>`).join('')+'<p class="note">Origin and source-evidence links are not exposed by this Rust endpoint. An active claim is not a verification of truth.</p>';
  });
}
function tags() { load('/v1/tags', r => (r.tags || []).length ? `<div class="tag-list">${r.tags.map(t => `<button class="tag-button" data-tag="${esc(t.name)}">${esc(t.name)}<span>${number(t.count)} episodes</span></button>`).join('')}</div>` : empty('No tags yet','Add tags when storing memory to organize and filter it here.')); }
function profile() { load('/v1/profile', r => {
  const facts=r.static_facts || [], recent=r.dynamic || [];
  if (!facts.length && !recent.length) return empty('No profile yet','Store memory in this space to start building its history.');
  return (facts.length ? `<section class="belief-group"><h2>Recorded beliefs</h2><div class="result-list">${facts.map(f => `<article class="result body">${esc(f.subject)} ${esc(f.predicate)} ${esc(f.object)}</article>`).join('')}</div></section>` : '')+(recent.length ? `<section><h2>Recent memory excerpts</h2><div class="result-list">${recent.map(text => `<article class="result body">${esc(text)}</article>`).join('')}</div></section>` : '');
}); }
function statusView() { load('/v1/status', r => `<div class="stats">${[['Episodes',r.episodes],['Chunks',r.chunks],['Revision',r.revision]].map(([label,value]) => `<div class="stat-card"><span>${label}</span><strong>${number(value)}</strong></div>`).join('')}</div><section class="panel"><h2>Engine details</h2><dl class="detail-grid"><dt>Space</dt><dd>${esc(r.space)}</dd><dt>Product</dt><dd>Rust engine</dd><dt>Semantic lane</dt><dd>${esc(r.semantic_lane)}</dd><dt>Pending work</dt><dd>${number(r.pending_distill)} awaiting distillation</dd></dl></section><p class="note">${r.semantic_lane === 'paused' ? 'Distillation is paused; no answering model is configured. Stored source memory remains searchable. ' : ''}Live events and analytics are not exposed by this Rust API.</p>`); }
const views={search,facts,tags,profile,status:statusView};
function activate(name) {
  if (!views[name]) name='search';
  view=name; ++generation; if (activeRequest) activeRequest.abort(); out.removeAttribute('aria-busy');
  const [section,title,description]=titles[name]; $('section').textContent=section; $('title').textContent=title; $('description').textContent=description; $('crumb').textContent=title; document.title='Scone · '+title;
  document.querySelectorAll('nav button').forEach(b => { if (b.dataset.view === name) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('controls').hidden=name !== 'search';
  if (location.hash !== '#'+name) history.replaceState(null,'','#'+name);
  views[name]();
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click',() => activate(b.dataset.view)));
$('controls').onsubmit=e => {e.preventDefault();search();};
$('tags').oninput=filterChips; $('asof').onchange=filterChips;
$('clear-filters').onclick=() => { $('tags').value=''; $('asof').value=''; search(); };
$('filter-chips').onclick=e => {const b=e.target.closest('[data-clear]'); if (b) {$(b.dataset.clear).value=''; search();}};
out.onclick=e => {
  const retry=e.target.closest('[data-retry]'); if (retry) {activate(view);return;}
  const tag=e.target.closest('[data-tag]'); if (tag) { $('tags').value=tag.dataset.tag; activate('search'); q.focus(); return; }
  const close=e.target.closest('[data-close]'); if (!close) return;
  closing=close.dataset.close; closeTrigger=close; $('close-value').textContent=close.dataset.value; $('close-reason').value=''; $('close-error').hidden=true; $('close-dialog').showModal(); $('close-reason').focus();
};
$('cancel-close').onclick=() => $('close-dialog').close();
$('close-dialog').addEventListener('close',() => { if (closeTrigger?.isConnected) closeTrigger.focus(); });
$('close-form').onsubmit=async e => {
  e.preventDefault(); const reason=$('close-reason').value.trim(); if (!reason || !closing) return;
  const own=generation; $('confirm-close').disabled=true; $('cancel-close').disabled=true;
  try { await api('/v1/facts/'+encodeURIComponent(closing)+'/close',{method:'POST',body:JSON.stringify({reason})}); $('close-dialog').close(); if (own === generation && view === 'facts') facts(); }
  catch (error) { $('close-error').textContent=error.message; $('close-error').hidden=false; }
  finally { $('confirm-close').disabled=false; $('cancel-close').disabled=false; }
};
window.addEventListener('hashchange',() => activate(location.hash.slice(1)));
const params=new URLSearchParams(location.search); q.value=params.get('q') || ''; $('tags').value=params.get('tags') || '';
activate(location.hash.slice(1) || 'search');
api('/v1/status').then(r => {$('space').textContent=r.space || 'Not reported';}).catch(error => {$('space').textContent=error.status === 401 ? 'Not authorized' : 'Unavailable'; if (error.status === 401) {++generation;if(activeRequest)activeRequest.abort();showError(error);} });
</script>
