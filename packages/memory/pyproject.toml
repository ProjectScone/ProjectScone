[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scone-memory"
version = "0.1.0"
description = "Memory infrastructure for LLMs, RAG and agents: verbatim episodes, a dated fact ledger, hybrid recall and an evidence log over pluggable stores (SQLite, MongoDB, PostgreSQL, Qdrant, Redis, Chroma, LanceDB), served by FastAPI and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-ProjectScone-Research-Attribution-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Mark Sturman" }]
keywords = ["memory", "agents", "retrieval", "rag", "temporal", "knowledge", "qdrant", "mongodb", "postgres", "pgvector", "redis", "chroma", "lancedb", "fastapi", "mcp", "langchain", "llamaindex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
documents = ["scone-memory[pdf]", "defusedxml>=0.7,<1"]
document-workflows = ["scone-memory[documents,agents]"]
document-converters = ["scone-memory[documents]", "striprtf>=0.0.33,<0.1", "python-calamine>=0.8.2,<1", "extract-msg>=0.56.1,<1"]
images = ["Pillow>=10.4"]
pdf = ["pypdf>=6.8,<7"]
pdf-ocr = ["scone-memory[pdf]", "pypdfium2>=5.13,<6", "Pillow>=10.4"]
pdf-test = ["scone-memory[documents,test]"]
agents = ["cryptography>=42"]
structured-output = ["jsonschema>=4.26,<5"]
aws = ["boto3>=1.40,<2"]
aws-test = ["scone-memory[aws,test]", "moto[s3,dynamodb]>=5,<6"]
mongo = ["pymongo>=4.13"]
qdrant = ["qdrant-client>=1.12"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=2,<3"]
remote-embed = ["httpx>=0.27"]
speech = ["httpx>=0.27,<1"]
vision = ["httpx>=0.27,<1", "Pillow>=10.4"]
local-embed = ["fastembed>=0.4"]
offline-rerank = ["fastembed>=0.8,<0.9"]
postgres = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
redis = ["redis>=5"]
elasticache = ["redis>=5"]
elasticsearch = ["elasticsearch[async]>=8,<9"]
opensearch = ["httpx>=0.27,<1"]
milvus = ["pymilvus>=2.5,<3"]
milvus-lite = ["pymilvus[milvus_lite]>=2.5,<3"]
chroma = ["chromadb>=1.0"]
lancedb = ["lancedb>=0.20"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
openai-agents = ["openai-agents>=0.2"]
all = ["scone-memory[documents,aws,mongo,qdrant,postgres,redis,elasticache,elasticsearch,opensearch,milvus,chroma,lancedb,api,mcp,remote-embed,local-embed,offline-rerank,structured-output]"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "fastapi>=0.115", "mcp>=2,<3", "cryptography>=42", "uvicorn>=0.30", "websockets>=13", "Pillow>=10.4", "jsonschema>=4.26,<5"]
typing = ["mypy==2.3.1", "pyarrow-stubs>=20", "types-defusedxml>=0.7", "pytest>=8", "scone-memory[all,documents,agents,pdf-ocr,vision,langchain,llamaindex,openai-agents]"]

[project.scripts]
scone-memory = "scone_memory.runtime.cli:main"
scone-memory-mcp = "scone_memory.runtime.mcp:main"

[project.urls]
Homepage = "https://github.com/ProjectScone/ProjectScone"
Source = "https://github.com/ProjectScone/ProjectScone/tree/main/packages/memory"
Issues = "https://github.com/ProjectScone/ProjectScone/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scone_memory*"]

[tool.setuptools.package-data]
"scone_memory" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Dump every thread's stack for a test that has run ten minutes, and let
# it carry on: `faulthandler_exit_on_timeout` defaults to false, so this
# fails nothing, skips nothing and changes no result. It is a diagnostic,
# not a deadline -- a deadline near our real maximum would turn a slow
# process fixture under load into a flake, which is worse than what it
# would catch. The slowest things we have are far below this: 203s for
# the 22 AWS catalog tests together, and a 180s migration budget.
#
# It exists because a stalled run reported nothing at all: on 2026-09-12
# the full gate sat at 0% CPU twice, at different points on identical
# code, with no failing test, no name and no traceback -- and CI is
# exposed to the same stall on a runner where nobody is watching %CPU.
# With this set the job still hangs, but its log says which test and what
# it is waiting on.
faulthandler_timeout = 600
markers = [
    "mongo: needs a live MongoDB at SCONE_TEST_MONGO_URL",
    "qdrant: needs a live Qdrant at SCONE_TEST_QDRANT_URL",
    "postgres: needs a live PostgreSQL with pgvector at SCONE_TEST_POSTGRES_URL",
    "redis: needs a live Redis with RediSearch at SCONE_TEST_REDIS_URL",
    "elasticsearch: needs a live Elasticsearch 8 at SCONE_TEST_ELASTICSEARCH_URL",
    "opensearch: needs a live self-managed OpenSearch at SCONE_TEST_OPENSEARCH_URL",
]
