[mypy]
follow_imports = silent

# PyMilvus publishes annotations without a py.typed marker. Analyze those
# annotations instead of suppressing missing-import or downstream type errors.
[mypy-pymilvus.*]
follow_untyped_imports = True

# PyMilvus 2.6.17 (and 3.0.1) generates the illegal declaration
# `None: _ClassVar[...]` in these two protobuf stubs. Only those generated
# wire-format modules are skipped; the public SDK and our adapter are analyzed.
[mypy-pymilvus.grpc_gen.schema_pb2,pymilvus.grpc_gen.common_pb2]
follow_imports = skip
follow_imports_for_stubs = True

# PDFium's Python wrapper has no py.typed marker; analyze its published source.
[mypy-pypdfium2.*]
follow_untyped_imports = True

# tree-sitter and its grammars are the optional `code-graph` and
# `code-languages` extras and are not installed in this environment, so
# their API is unchecked here rather than reported missing. They ship
# `py.typed`, so installing the extras in the type-check environment would
# check the calls properly -- worth doing if they ever become something we
# expect most callers to have.
[mypy-tree_sitter.*,tree_sitter_typescript.*,tree_sitter_language_pack.*]
ignore_missing_imports = True
